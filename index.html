<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосование за танец</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 15px; text-align: center; }
        .header { margin: 15px 0; }
        h1 { font-size: 24px; color: #ff007f; margin: 0; text-transform: uppercase; }
        .status-box { font-size: 16px; color: #00ffff; margin: 5px 0 20px 0; font-weight: bold; }
        
        .buttons-container { display: flex; flex-direction: column; gap: 12px; max-width: 500px; margin: 0 auto; }
        
        /* Кнопки стилей танцев */
        .vote-btn { 
            background: #2a2a2a; color: white; border: 2px solid #3a3a3a; padding: 18px; 
            font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; 
            transition: all 0.2s ease; display: block; width: 100%; box-sizing: border-box;
        }
        /* Эффект успешного клика */
        .vote-btn:active { background: #ff007f; border-color: #ff007f; transform: scale(0.97); }
        
        /* Состояние блокировки, когда голосования нет */
        .vote-btn:disabled { background: #151515; color: #444; border-color: #222; cursor: not-allowed; }
        
        /* Информационная плашка внизу */
        .footer { font-size: 12px; color: #555; margin-top: 30px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Танцевальный Конструктор</h1>
        <div id="statusText" class="status-box">Загрузка голосования...</div>
    </div>

    <div class="buttons-container" id="buttonsList">
        <!-- Кнопки для зрителей генерируются здесь автоматически -->
    </div>

    <div class="footer">Шоу-балет «Танцевальный Конструктор» © 2026</div>

    <script>
        const dbUrl = "https://dance-constructor-default-rtdb.europe-west1.firebasedatabase.app";
        let isVotingActive = false;

        // Функция отправки клика зрителя (Прибавляем +1 голос к выбранному ID)
        function castVote(id) {
            if (!isVotingActive) return;

            // Сначала считываем текущее число голосов, прибавляем 1 и сохраняем обратно
            fetch(`${dbUrl}/options/${id}/votes.json`)
            .then(res => res.json())
            .then(currentVotes => {
                let newVotes = (currentVotes || 0) + 1;
                return fetch(`${dbUrl}/options/${id}/votes.json`, {
                    method: 'PUT',
                    body: JSON.stringify(newVotes)
                });
            })
            .then(() => {
                // Визуальный отклик на телефоне зрителя после успешного голоса
                let clickedBtn = document.getElementById(`btn-${id}`);
                if (clickedBtn) {
                    clickedBtn.style.background = "#00ffff";
                    clickedBtn.style.borderColor = "#00ffff";
                    clickedBtn.style.color = "#111";
                    // Отключаем кнопки, чтобы один человек не кликал бесконечно в одном раунде
                    disableAllButtons();
                    document.getElementById('statusText').innerText = "Ваш голос учтен! Ожидайте сцену.";
                }
            })
            .catch(e => console.log("Ошибка отправки голоса: ", e));
        }

        function disableAllButtons() {
            const buttons = document.querySelectorAll('.vote-btn');
            buttons.forEach(btn => btn.disabled = true);
        }

        // Постоянная синхронизация смартфона зрителя с базой шоу
        function syncViewer() {
            // 1. Получаем глобальный статус шоу
            fetch(`${dbUrl}/show.json`)
            .then(res => res.json())
            .then(showData => {
                if (!showData) return;
                const statusEl = document.getElementById('statusText');

                if (showData.status === "waiting") {
                    isVotingActive = false;
                    statusEl.innerText = "ВНИМАНИЕ НА СЦЕНУ! ОЖИДАНИЕ СТАРТА...";
                    statusEl.style.color = "#aaa";
                } else if (showData.status === "active") {
                    // Голосование началось! Включаем интерактив
                    if (isVotingActive === false) { 
                        isVotingActive = true; 
                        // Сбрасываем цвета кнопок к дефолтным, если это новый раунд
                        refreshButtonsList(); 
                    }
                    statusEl.innerText = `УСПЕЙ ПРОГОЛОСОВАТЬ! ОСТАЛОСЬ: ${showData.timer} сек`;
                    statusEl.style.color = "#ff007f";
                } else if (showData.status === "finished") {
                    isVotingActive = false;
                    statusEl.innerText = `РАУНД ОКОНЧЕН! ВЫБРАН: ${showData.winner.toUpperCase()}`;
                    statusEl.style.color = "#00ffff";
                    disableAllButtons();
                }
            })
            .catch(e => console.log(e));
        }

        // Функция отрисовки кнопок на основе активных вариантов из базы
        function refreshButtonsList() {
            fetch(`${dbUrl}/options.json`)
            .then(res => res.json())
            .then(options => {
                if (!options) return;
                const container = document.getElementById('buttonsList');
                container.innerHTML = ""; // Очищаем контейнер

                for (let key in options) {
                    const opt = options[key];
                    // ЕСЛИ ВАРИАНТ УДАЛЕН АДМИНИСТРАТОРОМ - ОН ВООБЩЕ НЕ ПОЯВИТСЯ НА ТЕЛЕФОНЕ ЗРИТЕЛЯ!
                    if (opt.active) {
                        let btn = document.createElement('button');
                        btn.id = `btn-${key}`;
                        btn.className = 'vote-btn';
                        btn.innerText = opt.name;
                        btn.onclick = () => castVote(key);
                        
                        // Если в этот момент голосование глобально закрыто — кнопка будет серой
                        if (!isVotingActive) btn.disabled = true;

                        container.appendChild(btn);
                    }
                }
            });
        }

        // Запуск системы опроса (раз в секунду обновляем статус)
        setInterval(syncViewer, 1000);
        // Первичный вывод списка кнопок
        refreshButtonsList();
    </script>
</body>
</html>
