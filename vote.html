<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосование за танец</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 15px; text-align: center; }
        .header { margin: 15px 0; }
        h1 { font-size: 24px; color: #ff007f; margin: 0; text-transform: uppercase; text-shadow: 0 0 10px #ff007f; }
        .status-box { font-size: 16px; color: #00ffff; margin: 5px 0 20px 0; font-weight: bold; }
        
        .buttons-container { display: flex; flex-direction: column; gap: 12px; max-width: 500px; margin: 0 auto; }
        
        /* Кнопки стилей танцев */
        .vote-btn { 
            background: #2a2a2a; color: white; border: 2px solid #333; padding: 18px; 
            font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; 
            transition: all 0.2s ease; display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box;
        }
        .vote-btn:active { transform: scale(0.97); }
        
        /* Кнопка за которую проголосовал текущий зритель */
        .vote-btn.my-choice { background: #ff007f !important; border-color: #ff007f !important; color: #fff !important; }
        
        /* Состояние блокировки кнопок */
        .vote-btn:disabled { background: #151515; color: #444; border-color: #222; cursor: not-allowed; }
        
        /* Проценты внутри кнопки */
        .btn-percent { color: #00ffff; font-family: monospace; font-size: 18px; }
        .vote-btn:disabled .btn-percent { color: #444; }
        .vote-btn.my-choice .btn-percent { color: #fff; }
        
        .footer { font-size: 12px; color: #555; margin-top: 30px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Танцевальный Конструктор</h1>
        <div id="statusText" class="status-box">Подключение к шоу...</div>
    </div>

    <div class="buttons-container" id="buttonsList">
        <!-- Кнопки создаются динамически -->
    </div>

    <div class="footer">Шоу-балет «Танцевальный Конструктор» © 2026</div>

    <script>
        const dbUrl = "https://firebasedatabase.app";
        let isVotingActive = false;
        let hasVotedInThisRound = false;
        let myChoiceId = "";

        // Постоянная синхронизация смартфона зрителя с базой шоу
        function syncViewer() {
            // 1. Получаем глобальный статус шоу
            fetch(`${dbUrl}/show.json`)
            .then(res => res.json())
            .then(showData => {
                if (!showData) return;
                const statusEl = document.getElementById('statusText');

                if (showData.status === "waiting") {
                    isVotingActive = false;
                    hasVotedInThisRound = false; 
                    myChoiceId = "";
                    statusEl.innerText = "ВНИМАНИЕ НА СЦЕНУ! ОЖИДАНИЕ СТАРТА...";
                    statusEl.style.color = "#aaa";
                } else if (showData.status === "active") {
                    isVotingActive = true;
                    if (!hasVotedInThisRound) {
                        statusEl.innerText = `УСПЕЙ ПРОГОЛОСОВАТЬ! ОСТАЛОСЬ: ${showData.timer} СЕК`;
                        statusEl.style.color = "#ff007f";
                    } else {
                        statusEl.innerText = "ВАШ ГОЛОС УЧТЕН! СЛЕДИТЕ ЗА ПРОЦЕНТАМИ:";
                        statusEl.style.color = "#00ffff";
                    }
                } else if (showData.status === "finished") {
                    isVotingActive = false;
                    statusEl.innerText = `РАУНД ОКОНЧЕН! ВЫБРАН: ${showData.winner.toUpperCase()}`;
                    statusEl.style.color = "#00ffff";
                }
                
                return showData;
            })
            .then(showData => {
                // 2. Получаем варианты и динамически обновляем проценты прямо на кнопках
                fetch(`${dbUrl}/options.json`)
                .then(res => res.json())
                .then(options => {
                    if (!options) return;

                    // Считаем общую сумму голосов для вычисления процентов
                    let totalVotes = 0;
                    for (let key in options) {
                        if (options[key].active) totalVotes += (options[key].votes || 0);
                    }

                    const container = document.getElementById('buttonsList');
                    
                    // Если кнопок на экране ещё нет — создаем их структуру один раз
                    if (container.children.length === 0) {
                        for (let key in options) {
                            if (options[key].active) {
                                let btn = document.createElement('button');
                                btn.id = `btn-${key}`;
                                btn.className = 'vote-btn';
                                btn.innerHTML = `
                                    <span>${options[key].name}</span>
                                    <span class="btn-percent" id="per-${key}">0%</span>
                                `;
                                btn.onclick = () => castVote(key);
                                container.appendChild(btn);
                            }
                        }
                    }

                    // Обновляем проценты и состояние блокировок на существующих кнопках
                    for (let key in options) {
                        const opt = options[key];
                        const btn = document.getElementById(`btn-${key}`);
                        const percentEl = document.getElementById(`per-${key}`);
                        
                        if (btn && percentEl) {
                            let percent = totalVotes > 0 ? Math.round((opt.votes || 0) / totalVotes * 100) : 0;
                            percentEl.innerText = percent + "%";

                            if (!opt.active) {
                                // Если вариант выбыл — плавно удаляем его из списка на телефоне
                                btn.remove();
                            } else if (!isVotingActive || hasVotedInThisRound || (showData && showData.status === "finished")) {
                                // Блокируем клики во время паузы или после того, как человек проголосовал
                                btn.disabled = true;
                                if (myChoiceId === key) {
                                    btn.classList.add('my-choice');
                                } else {
                                    btn.classList.remove('my-choice');
                                }
                            } else {
                                // Возвращаем кнопку в активное состояние для нового раунда
                                btn.disabled = false;
                                btn.classList.remove('my-choice');
                            }
                        }
                    }
                });
            })
            .catch(e => console.log(e));
        }

        // Функция отправки клика зрителя
        function castVote(id) {
            if (!isVotingActive || hasVotedInThisRound) return;

            hasVotedInThisRound = true;
            myChoiceId = id;

            fetch(`${dbUrl}/options/${id}/votes.json`)
            .then(res => res.json())
            .then(currentVotes => {
                let newVotes = (currentVotes || 0) + 1;
                return fetch(`${dbUrl}/options/${id}/votes.json`, {
                    method: 'PUT',
                    body: JSON.stringify(newVotes)
                });
            })
            .catch(e => console.log("Ошибка отправки голоса: ", e));
        }

        // Включаем постоянный опрос сети раз в секунду
        setInterval(syncViewer, 1000);
        syncViewer();
    </script>
</body>
</html>
