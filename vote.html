<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосование за танец</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #111; color: #fff; margin: 0; padding: 15px; text-align: center; }
        .header { margin: 10px 0 15px 0; }
        h1 { font-size: 22px; color: #ff007f; margin: 0; text-transform: uppercase; text-shadow: 0 0 10px #ff007f; }
        .status-box { font-size: 15px; color: #aaa; margin: 5px 0 10px 0; font-weight: bold; text-transform: uppercase; min-height: 20px; }
        
        .mobile-timer { font-size: 55px; font-weight: bold; color: #00ffff; text-shadow: 0 0 15px #00ffff; font-family: monospace; margin: 10px 0 20px 0; display: none; }
        
        .buttons-container { display: flex; flex-direction: column; gap: 12px; max-width: 500px; margin: 0 auto; }
        
        .vote-btn { 
            background: #222; color: white; border: 2px solid #333; padding: 18px; 
            font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; 
            transition: all 0.3s ease; display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box;
        }
        .vote-btn:active { transform: scale(0.97); }
        
        .vote-btn.my-choice { background: #ff007f !important; border-color: #ff007f !important; color: #fff !important; box-shadow: 0 0 15px #ff007f; }
        .vote-btn.winner-highlight { background: #1a3333 !important; border-color: #00ffff !important; color: #00ffff !important; box-shadow: 0 0 20px #00ffff; animation: mobilePulse 0.4s infinite alternate; }
        @keyframes mobilePulse { from { transform: scale(1); } to { transform: scale(1.02); } }
        
        .vote-btn:disabled { background: #151515; color: #444; border-color: #222; cursor: not-allowed; }
        
        .btn-percent { color: #00ffff; font-family: monospace; font-size: 18px; font-weight: bold; }
        .vote-btn:disabled .btn-percent { color: #444; }
        .vote-btn.my-choice .btn-percent { color: #fff; }
        .vote-btn.winner-highlight .btn-percent { color: #00ffff; }
        
        .footer { font-size: 11px; color: #444; margin-top: 35px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Танцевальный Конструктор</h1>
        <div id="statusText" class="status-box">Ожидание подключения...</div>
        <div id="mobileCountdown" class="mobile-timer">15</div>
    </div>

    <div class="buttons-container" id="buttonsList">
        <!-- Кнопки создадутся в любом случае -->
    </div>

    <div class="footer">Шоу-балет «Танцевальный Конструктор» © 2026</div>

    <script>
        const dbUrl = "https://firebasedatabase.app";
        let isVotingActive = false;
        let hasVotedInThisRound = false;
        let myChoiceId = "";

        // Резервный список названий (отобразится сразу, если сеть тормозит)
        const backupOptions = {
            "opt1": { id: "opt1", name: "Танго страсти", votes: 0, active: true },
            "opt2": { id: "opt2", name: "Хип-хоп баттл", votes: 0, active: true },
            "opt3": { id: "opt3", name: "Современный контемп", votes: 0, active: true },
            "opt4": { id: "opt4", name: "Дерзкий вог (Vogue)", votes: 0, active: true },
            "opt5": { id: "opt5", name: "Зажигательная латина", votes: 0, active: true },
            "opt6": { id: "opt6", name: "Уличный брейк-данс", votes: 0, active: true },
            "opt7": { id: "opt7", name: "Классический вальс", votes: 0, active: true },
            "opt8": { id: "opt8", name: "Джаз-фанк взрыв", votes: 0, active: true },
            "opt9": { id: "opt9", name: "Ретро Диско", votes: 0, active: true },
            "opt10": { id: "opt10", name: "Рок-н-ролл драйв", votes: 0, active: true }
        };

        function castVote(id) {
            if (!isVotingActive || hasVotedInThisRound) return;
            hasVotedInThisRound = true;
            myChoiceId = id;

            fetch(`${dbUrl}/options/${id}/votes.json`)
            .then(res => res.json())
            .then(currentVotes => {
                let newVotes = (currentVotes || 0) + 1;
                return fetch(`${dbUrl}/options/${id}/votes.json`, {
                    method: 'PUT',
                    body: JSON.stringify(newVotes)
                });
            })
            .then(() => {
                let clickedBtn = document.getElementById(`btn-${id}`);
                if (clickedBtn) clickedBtn.classList.add('my-choice');
                document.getElementById('statusText').innerText = "Голос принят! Ожидайте финала:";
            })
            .catch(e => console.log(e));
        }

        function syncViewer() {
            // Читаем глобальный статус шоу
            fetch(`${dbUrl}/show.json`)
            .then(res => res.json())
            .then(showData => {
                const statusEl = document.getElementById('statusText');
                const timerEl = document.getElementById('mobileCountdown');

                if (!showData) {
                    statusEl.innerText = "Подключено. Ожидание старта...";
                    return { status: "waiting" };
                }

                if (showData.status === "waiting") {
                    isVotingActive = false;
                    hasVotedInThisRound = false;
                    myChoiceId = "";
                    statusEl.innerText = "Внимание на сцену! Ожидайте старта...";
                    statusEl.style.color = "#aaa";
                    timerEl.style.display = "none";
                } else if (showData.status === "active") {
                    isVotingActive = true;
                    timerEl.style.display = "block";
                    timerEl.innerText = showData.timer;
                    if (!hasVotedInThisRound) {
                        statusEl.innerText = "Успей проголосовать!";
                        statusEl.style.color = "#ff007f";
                    }
                } else if (showData.status === "finished") {
                    isVotingActive = false;
                    timerEl.style.display = "none";
                    statusEl.innerText = `Победил номер: ${showData.winner ? showData.winner.toUpperCase() : '---'}`;
                    statusEl.style.color = "#00ffff";
                }
                return showData;
            })
            .then(showData => {
                // Читаем варианты и проценты
                fetch(`${dbUrl}/options.json`)
                .then(res => res.json())
                .then(options => {
                    // Если база пуста — берем резервный список
                    const currentOptions = options || backupOptions;
                    
                    let totalVotes = 0;
                    for (let key in currentOptions) {
                        if (currentOptions[key].active) totalVotes += (currentOptions[key].votes || 0);
                    }

                    for (let key in currentOptions) {
                        const opt = currentOptions[key];
                        const btn = document.getElementById(`btn-${key}`);
                        const percentEl = document.getElementById(`per-${key}`);
                        
                        if (btn && percentEl) {
                            let percent = totalVotes > 0 ? Math.round((opt.votes || 0) / totalVotes * 100) : 0;
                            percentEl.innerText = percent + "%";

                            btn.classList.remove('winner-highlight');

                            if (!opt.active) {
                                btn.remove();
                            } else if (showData && showData.status === "finished") {
                                btn.disabled = true;
                                btn.classList.remove('my-choice');
                                if (showData.winnerId === key) {
                                    btn.classList.add('winner-highlight');
                                }
                            } else if (!isVotingActive || hasVotedInThisRound) {
                                btn.disabled = true;
